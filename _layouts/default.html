<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 150 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div class="eyebrow">개인 홈페이지</div>
      <a class="home" href="{{ '/' | relative_url }}"><span class="site-title">{{ site.title }}</span></a>
      <p class="tagline">{{ site.description }}</p>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
      <a href="{{ '/write/' | relative_url }}">글쓰기</a>
    </footer>
  </div>
</body>
</html>
