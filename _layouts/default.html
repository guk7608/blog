<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 150 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="mast">
      <div class="eyebrow">개인 홈페이지</div>
      <a class="home" href="{{ '/' | relative_url }}"><span class="site-title">{{ site.title }}</span></a>
      {% if site.description != "" %}<p class="tagline">{{ site.description }}</p>{% endif %}
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
      <span class="counter">
        <img id="badge-today" alt="오늘 방문자 수" height="20">
        <img id="badge-total" alt="전체 방문자 수" height="20">
      </span>
      <a href="{{ '/write/' | relative_url }}">글쓰기</a>
    </footer>
  </div>
  <script>
    (function () {
      // Labels are space-padded: the badge service underestimates Korean glyph width.
      // Day key is fixed to Korea time so the "오늘" count rolls over at KST midnight.
      var now = new Date();
      var k = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
      var p = function (n) { return ('0' + n).slice(-2); };
      var day = k.getFullYear() + '-' + p(k.getMonth() + 1) + '-' + p(k.getDate());
      var base = 'https://visitor-badge.laobi.icu/badge?left_color=%235C6878&right_color=%231E5A85&left_text=';
      document.getElementById('badge-today').src = base + encodeURIComponent(' 오늘 ') + '&page_id=guk7608.blog.daily.' + day;
      document.getElementById('badge-total').src = base + encodeURIComponent(' 전체 ') + '&page_id=guk7608.blog.total';
    })();
  </script>
</body>
</html>
