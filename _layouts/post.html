---
layout: default
---
<article class="post single">
  <div class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d %H:%M' }}</time></div>
  <h1>{{ page.title }}</h1>
  <div class="body">
    {{ content }}
  </div>
</article>

<nav class="pager">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><span>이전 글</span>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><span>다음 글</span>{{ page.next.title }}</a>{% endif %}
</nav>
<p class="back"><a href="{{ '/' | relative_url }}">← 글 목록</a></p>
